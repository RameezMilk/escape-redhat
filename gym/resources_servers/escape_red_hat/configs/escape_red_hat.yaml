# Escape from Red Hat — NeMo Gym environment config (nemo-gym==0.6.0).
# Requires the Escape from Red Hat server running (apps/server) at escape_api_url / $ESCAPE_API_URL.
escape_red_hat_resources_server:
  resources_servers:
    escape_red_hat:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Office evacuation drill — one planner coordinates three simulated people through 9 validated tools
      escape_api_url: ${oc.env:ESCAPE_API_URL,http://127.0.0.1:8787}
      max_decisions: 24
      request_timeout_s: 60.0
escape_red_hat_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      # A drill needs ~14-24 tool calls; the engine also caps decisions (max_decisions above).
      max_steps: 30
      resources_server:
        type: resources_servers
        name: escape_red_hat_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/escape_red_hat/data/example.jsonl
        license: Creative Commons Attribution 4.0 International
      - name: dev_v2
        type: validation
        jsonl_fpath: resources_servers/escape_red_hat/data/dev_v2.jsonl
        license: Creative Commons Attribution 4.0 International
      - name: test_v1
        type: validation
        jsonl_fpath: resources_servers/escape_red_hat/data/test_v1.jsonl
        license: Creative Commons Attribution 4.0 International
      - name: test_v2
        type: validation
        jsonl_fpath: resources_servers/escape_red_hat/data/test_v2.jsonl
        license: Creative Commons Attribution 4.0 International
