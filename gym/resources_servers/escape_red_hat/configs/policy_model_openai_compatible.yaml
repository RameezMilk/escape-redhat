# Policy model for Escape from Red Hat rollouts: any OpenAI-compatible chat-completions endpoint serving
# Nemotron 3.5 Lightning 30B-A3B. Gym's vllm_model server converts the Responses API to /v1/chat/completions.
#   Self-hosted vLLM (final runs):  policy_base_url=http://localhost:8000/v1  policy_model_name=nemotron-3.5-lightning
#   Hosted NVIDIA API Catalog (dev): policy_base_url=https://integrate.api.nvidia.com/v1
#                                    policy_model_name=nvidia/nemotron-3.5-lightning-30b-a3b
policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      return_token_id_information: false
      uses_reasoning_parser: true
      # vLLM: thinking off for low-latency planning (same as the app). The hosted Catalog hung on
      # chat_template_kwargs when tested (2026-10-17): override with ++policy_model.responses_api_models.vllm_model.chat_template_kwargs=null
      chat_template_kwargs:
        enable_thinking: false
