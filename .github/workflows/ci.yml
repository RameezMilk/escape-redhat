# Quality gate on every push and pull request: install from the lockfile, typecheck every workspace, run all unit and
# integration tests (scripted fixture, so no model or secrets are needed), then build the web app.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
